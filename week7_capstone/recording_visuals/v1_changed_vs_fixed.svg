<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="One factor changed, everything else held fixed"><rect width="1920" height="1080" fill="#fcfcfb"/><text x="80" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#0b0b0b" text-anchor="start" >ONE FACTOR CHANGED</text><rect x="80" y="140" width="1760" height="290" rx="18" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="120" y="200" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="50" font-weight="600" fill="#0b0b0b" text-anchor="start" >model.pos_encoding</text><rect x="120" y="232" width="520" height="168" rx="14" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="2"/><rect x="120" y="232" width="14" height="168" rx="0" fill="#2a78d6" stroke="none" stroke-width="0"/><text x="164" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#52514e" text-anchor="start" >Arm A</text><text x="164" y="372" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="62" font-weight="800" fill="#0b0b0b" text-anchor="start" xml:space="preserve">= learned</text><circle cx="590" cy="268" r="14" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/><rect x="700" y="232" width="520" height="168" rx="14" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="2"/><rect x="700" y="232" width="14" height="168" rx="0" fill="#eb6834" stroke="none" stroke-width="0"/><text x="744" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#52514e" text-anchor="start" >Arm B</text><text x="744" y="372" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="62" font-weight="800" fill="#0b0b0b" text-anchor="start" xml:space="preserve">= sinusoidal</text><circle cx="1170" cy="268" r="14" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/><rect x="1280" y="232" width="520" height="168" rx="14" fill="#fcfcfb" stroke="#e6e5e1" stroke-width="2"/><rect x="1280" y="232" width="14" height="168" rx="0" fill="#1baf7a" stroke="none" stroke-width="0"/><text x="1324" y="304" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#52514e" text-anchor="start" >Arm C</text><text x="1324" y="372" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="62" font-weight="800" fill="#0b0b0b" text-anchor="start" xml:space="preserve">= rope</text><circle cx="1750" cy="268" r="14" fill="#1baf7a" stroke="#fcfcfb" stroke-width="3"/><text x="80" y="508" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#0b0b0b" text-anchor="start" >EVERYTHING ELSE HELD FIXED</text><rect x="80" y="548" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="102" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">MODEL ARCHITECTURE</text><text x="102" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >64-d · 3 layers · 4 heads</text><text x="102" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >d_ff 256 · dropout 0.1 · fp32</text><rect x="526" y="548" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="548" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">OPTIMIZER AND LEARNING RATE</text><text x="548" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >AdamW · lr 0.001</text><text x="548" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >no per-arm tuning</text><rect x="972" y="548" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="994" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">WEIGHT DECAY</text><text x="994" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >0.01</text><text x="994" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >same in every arm</text><rect x="1418" y="548" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="1440" y="584" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">WARMUP AND SCHEDULE</text><text x="1440" y="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >100 warmup steps</text><text x="1440" y="678" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >linear warmup, then linear decay</text><rect x="80" y="720" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="102" y="756" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">BATCH SIZE</text><text x="102" y="812" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >128</text><text x="102" y=
rif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >model seeds never touch the data</text><rect x="80" y="892" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="102" y="928" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">SAME DATASET</text><text x="102" y="984" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >16 series · 3 years</text><text x="102" y="1022" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >hash 65d899e6… in all 9 runs</text><rect x="526" y="892" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="548" y="928" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">MATCHED SEEDS</text><text x="548" y="984" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >0 · 1 · 2</text><text x="548" y="1022" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#52514e" text-anchor="start" >same three seeds for every arm</text><rect x="972" y="892" width="422" height="150" rx="12" fill="#f4f3f0" stroke="#e6e5e1" stroke-width="2"/><text x="994" y="928" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#52514e" text-anchor="start" letter-spacing="1.2">DETERMINISM POLICY</text><text x="994" y="984" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#0b0b0b" text-anchor="start" >P1</text><text x="994" y="1022" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" 